# PostgreSQL local pour le labo (docker compose up -d db).
# Identifiants de DEVELOPPEMENT uniquement — ne pas utiliser en production
# et ne jamais commiter de vrais secrets dans le depot.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: re_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
