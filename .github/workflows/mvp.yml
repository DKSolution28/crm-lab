name: mvp

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ubuntu
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_mvp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubuntu -d crm_mvp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ubuntu:postgres@127.0.0.1:5432/crm_mvp_ci
      TEST_DATABASE_URL: postgresql://ubuntu:postgres@127.0.0.1:5432/crm_mvp_ci
      CRM_LAB_SESSION_SECRET: ci-only-session-secret-32chars-minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
